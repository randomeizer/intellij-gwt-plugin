name: Check GWT releases

on:
  schedule:
    - cron: '17 22 * * *' # Daily at 08:17 Australia/Brisbane (UTC+10).
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gwt-releases.yml'
      - '.github/gwt-release-monitor.json'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: gwt-releases-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'monitor' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release detection and duplicate prevention
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  monitor:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create issues for unverified stable GWT releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_gwt_releases.py
