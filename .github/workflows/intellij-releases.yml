name: Check IntelliJ releases

on:
  schedule:
    - cron: '37 22 * * *' # Daily at 08:37 Australia/Brisbane (UTC+10).
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/intellij-releases.yml'
      - '.github/scripts/**'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: intellij-releases-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'monitor' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release detection and duplicate prevention
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  monitor:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create issues for new stable IntelliJ IDEA release lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_intellij_releases.py
